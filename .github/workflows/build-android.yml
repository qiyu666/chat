name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: CI=true npx cap sync android

      - name: Ensure cordova.variables.gradle has cdvPluginPostBuildExtras
        working-directory: ./android/capacitor-cordova-android-plugins
        run: |
          python3 <<'PYEOF'
          import os, re
          # 1) Ensure cordova.variables.gradle exists and defines cdvPluginPostBuildExtras
          vf = 'cordova.variables.gradle'
          if not os.path.exists(vf):
              with open(vf, 'w') as f:
                  f.write("// CI safety-net generated file\next {\n  cdvMinSdkVersion = 24\n  cdvPluginPostBuildExtras = []\n  cordovaConfig = [:]\n}\n")
          else:
              with open(vf, 'r') as f:
                  content = f.read()
              if 'cdvPluginPostBuildExtras' not in content:
                  with open(vf, 'a') as f:
                      f.write("\next.cdvPluginPostBuildExtras = []\next.cordovaConfig = [:]\n")
          # 2) Defensive: wrap for-loop in build.gradle with null check
          bf = 'build.gradle'
          if os.path.exists(bf):
              with open(bf, 'r') as f:
                  bcontent = f.read()
              pattern = re.compile(
                  r'(\n\s*)for\s*\(\s*def\s+func\s*:\s*cdvPluginPostBuildExtras\s*\)\s*\{(.*?func\(\)[\s\S]*?)\}',
                  re.DOTALL)
              def replacer(m):
                  indent = m.group(1)
                  inner = m.group(2)
                  return (f"{indent}if (project.hasProperty('cdvPluginPostBuildExtras') && cdvPluginPostBuildExtras != null) {{"
                          f"{indent}    for (def func : cdvPluginPostBuildExtras) {{{inner}    }}"
                          f"{indent}}}")
              new_content, n = pattern.subn(replacer, bcontent, count=1)
              if n > 0:
                  with open(bf, 'w') as f:
                      f.write(new_content)
                  print(f"Patched build.gradle ({n} occurrence)")
              else:
                  print("build.gradle did not need patching (no unsafe for-loop found)")
          PYEOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build debug APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build release APK (unsigned)
        working-directory: ./android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/signing.keystore
            ./gradlew assembleRelease --stacktrace \
              -Pandroid.injected.signing.store.file=app/signing.keystore \
              -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
              -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
              -Pandroid.injected.signing.key.password=$KEY_PASSWORD
            rm app/signing.keystore
          else
            ./gradlew assembleRelease --stacktrace
          fi

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
